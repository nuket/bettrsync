[package]
name = "bettrsync"
version = "0.1.0"
edition = "2021"
description = "A small sync tool: rsync -rltv with in-place, parallel block updates"

[dependencies]
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1
